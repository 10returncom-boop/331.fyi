<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知識筆記｜331.fyi</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 28 L12 9.5 L19 14.5 L28 4 L28 8 L9.5 28 Z' fill='%23C9A227'/%3E%3Cpath d='M28 4 L19 14.5 L20 16.5 L28 8 Z' fill='%23E3C46D'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+TC:wght@600;700;900&family=Noto+Sans+TC:wght@300;400;500;700&display=swap">
<style>
  :root{
    --bg:#0B1120;
    --gold:#C9A227;
    --gold-soft:#E3C46D;
    --paper:#F2ECDF;
    --muted:#B9C2D4;
    --line:rgba(201,162,39,.32);
    --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
    --sans:"Noto Sans TC","Microsoft JhengHei","微軟正黑體",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    font-family:var(--sans);
    background:var(--bg);
    color:var(--paper);
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  ::selection{background:rgba(201,162,39,.35)}
  .page{flex:1 1 auto;width:100%;max-width:1180px;margin:0 auto;padding:0 32px}

  /* ===== Hero 滿版 ===== */
  .hero{
    position:relative;
    min-height:100vh;
    display:flex;
    align-items:center;
    background:url('assets/hero.jpg') center/cover no-repeat;
  }
  .hero::before{
    content:"";
    position:absolute;
    inset:0;
    background:
      linear-gradient(105deg, rgba(8,12,24,.94) 0%, rgba(8,12,24,.74) 42%, rgba(8,12,24,.30) 72%, rgba(8,12,24,.14) 100%),
      linear-gradient(transparent 72%, rgba(8,12,24,.45) 100%);
  }
  .hero-copy{
    position:relative;
    z-index:1;
    width:100%;
    padding:96px 0;
  }
  .eyebrow{
    font-size:14px;
    letter-spacing:.34em;
    color:var(--gold-soft);
    margin-bottom:18px;
    display:flex;
    align-items:center;
    gap:14px;
  }
  h1{
    font-family:var(--serif);
    font-weight:900;
    font-size:clamp(2.9rem, 5.8vw, 4.9rem);
    line-height:1.2;
    letter-spacing:.06em;
    margin-bottom:30px;
    max-width:12em;
  }
  .ripple{
    display:inline-block;
    background:linear-gradient(90deg,
      #C9A227 0%, #E3C46D 12%, #FFF3CE 25%, #E3C46D 38%,
      #C9A227 50%, #E3C46D 62%, #FFF3CE 75%, #E3C46D 88%, #C9A227 100%);
    background-size:200% 100%;
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    color:transparent;
    animation:rippleWave 3s linear infinite;
  }
  @keyframes rippleWave{
    0%{background-position:0% 0}
    100%{background-position:200% 0}
  }
  .cta{
    display:inline-block;
    margin-top:28px;
    font-size:1rem;
    font-weight:500;
    letter-spacing:.06em;
    color:var(--gold-soft);
    text-decoration:none;
    padding-bottom:6px;
    border-bottom:1px solid var(--gold);
    transition:color .25s ease, border-color .25s ease;
  }
  .cta:hover{color:var(--paper);border-color:var(--paper)}
  .cta:focus-visible{
    outline:2px solid var(--gold);
    outline-offset:6px;
    border-radius:2px;
  }
  .cta-note{
    margin-top:14px;
    font-size:.85rem;
    color:rgba(185,194,212,.72);
  }

  /* ===== Footer ===== */
  footer{
    text-align:center;
    padding:40px 24px 52px;
    font-size:.88rem;
    letter-spacing:.22em;
    color:rgba(185,194,212,.62);
  }

  /* ===== Responsive ===== */
  @media (max-width:900px){
    .hero{min-height:88vh}
    .hero-copy{padding:88px 0 64px}
    .eyebrow{font-size:14px}
    .cta{display:inline-flex;align-items:center;min-height:44px;padding:0 4px}
    .cta-note{font-size:.88rem}
  }

  /* ===== Hero 淡入 ===== */
  .hero-copy{opacity:0;transform:translateY(18px)}
  .hero.is-in .hero-copy{
    opacity:1;transform:none;
    transition:opacity .9s ease, transform .9s ease;
  }
  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    .hero-copy{opacity:1;transform:none}
  }
</style>
</head>
<body>
  <main>

    <!-- ===== Hero 滿版 ===== -->
    <section class="hero" id="hero">
      <div class="page">
        <div class="hero-copy">
          <p class="eyebrow">331.fyi</p>
          <h1>知識<span class="ripple">筆</span>記</h1>
          <a class="cta" href="https://331.fyi/stationery-pen/index.html" target="_blank" rel="noopener">從文具控到鋼筆控</a>
</div>
      </div>
    </section>

  </main>

  <footer>一枝筆 · 一池墨 · 一代史</footer>

  <script>
    /* 全站防複製保護：封鎖右鍵、複製、剪下、文字選取與圖片拖曳（輸入框仍可正常選取） */
    (function () {
      var INPUT = /^(INPUT|TEXTAREA|SELECT)$/i;
      function block(e) { e.preventDefault(); }
      document.addEventListener('contextmenu', block);
      document.addEventListener('copy', function (e) { if (e.target && INPUT.test(e.target.tagName)) return; e.preventDefault(); });
      document.addEventListener('cut', block);
      document.addEventListener('selectstart', function (e) { if (e.target && INPUT.test(e.target.tagName)) return; e.preventDefault(); });
      document.addEventListener('dragstart', function (e) { if (e.target && INPUT.test(e.target.tagName)) return; e.preventDefault(); });
      document.addEventListener('keydown', function (e) {
        if (!(e.ctrlKey || e.metaKey)) return;
        if (e.key === 'c' || e.key === 'C' || e.key === 'x' || e.key === 'X') {
          if (e.target && INPUT.test(e.target.tagName)) return;
          e.preventDefault();
        }
      });
    })();
  </script>
  <style>
    body { -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; }
    input, textarea, select { -webkit-user-select: text; -moz-user-select: text; -ms-user-select: text; user-select: text; }
    img { -webkit-user-drag: none; -moz-user-drag: none; user-drag: none; }
  </style>
</body>
</html>
